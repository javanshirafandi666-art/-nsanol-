<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>İnsan Ol – Reabilitasiya Mərkəzi</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
animation:bg 3s infinite;
}
@keyframes bg{
0%{background:#000;}
50%{background:#300;}
100%{background:#000;}
}
.box{
background:#111;
padding:30px;
border-radius:15px;
display:flex;
gap:30px;
align-items:center;
box-shadow:0 0 30px red;
}
.logo{
width:220px;
background:#fff;
padding:10px;
border-radius:12px;
animation:blink 1.5s infinite;
}
@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:0.3;}
}
</style>
</head>
<body>
<div class="box">
<img src="logo.png" class="logo">
<div>
<h1>“İnsan Ol” Reabilitasiya Mərkəzi</h1>
<p>Beləliklə, siz də Xırdalan şəhərində yerləşən “İnsan Ol” Reabilitasiya Mərkəzinə yaxınlaşaraq normal insan ola bilərsiniz.</p>
<p>Əgər özünüzü qəribə hiss edirsinizsə, deməli yolunuz bizdən keçir.</p>
<b>www.insanol.com</b>
<p><i>İnsan olmaq ayıb deyil, gec qalmaq ayıbdır.</i></p>
</div>
</div>
</body>
</html>
